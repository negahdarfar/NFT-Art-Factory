name: NFT Art Factory validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/nft-art-factory.yml"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare example collection for CI
        run: cp collection.example.json collection.json
      - name: Create a tiny test artwork
        run: |
          mkdir -p assets
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pWQAAAAASUVORK5CYII=' | base64 -d > assets/artwork-001.png
      - name: Check all JavaScript module syntax
        run: |
          find scripts adapters storage worker -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - name: Validate governance and catalog JSON
        run: |
          node -e "for (const f of ['workflows/collection-catalog.example.json','workflows/90-day-operating-profile.json','workflows/collection-concepts.example.json','demand-signals.example.json','reviews/review-status.json','workflows/provenance-records.example.json']) JSON.parse(require('node:fs').readFileSync(f,'utf8')); console.log('Governance and example JSON: valid')"
      - name: Run adapter and intake tests
        run: npm test
      - name: Generate launch readiness report (informational)
        run: npm run readiness
      - name: Build read-only studio operations dashboard
        run: npm run studio:status
      - name: Audit artwork integrity and provenance
        run: npm run quality:artwork
      - name: Generate growth campaign drafts
        run: npm run growth:campaign
      - name: Generate curated concept briefs
        run: npm run concept:studio
      - name: Build metadata
        run: npm run build
      - name: Generate creator gallery preview
        run: npm run gallery
      - name: Generate interactive creator studio
        run: npm run studio
      - name: Generate marketplace listing drafts
        run: npm run marketplace:pack
      - name: Generate objkt Tezos listing draft
        run: npm run objkt:pack
      - name: Generate approval-gated marketing drafts
        run: npm run marketing:pack
      - name: Upload generated metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-metadata-preview
          path: dist/
