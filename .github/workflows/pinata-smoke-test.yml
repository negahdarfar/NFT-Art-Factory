name: Pinata one-time smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pinata-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinata-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-time Pinata smoke test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create a harmless synthetic SVG test item
        run: |
          mkdir -p assets reviews
          cat > assets/pinata-smoke-test.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
            <rect width="640" height="360" fill="#111827"/>
            <circle cx="320" cy="150" r="82" fill="#7c3aed"/>
            <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#ffffff">PINATA TEST ONLY</text>
          </svg>
          SVG
          cat > collection.json <<'JSON'
          {
            "name": "NFT Art Factory Pinata Smoke Test",
            "description": "A harmless synthetic test asset, not a sale item.",
            "symbol": "NFTTEST",
            "seller_fee_basis_points": 0,
            "fee_recipient": "",
            "items": [
              {
                "name": "Pinata Smoke Test",
                "description": "Synthetic SVG used only to verify Pinata public IPFS upload.",
                "image": "pinata-smoke-test.svg",
                "attributes": [{"trait_type": "Purpose", "value": "Connectivity Test"}]
              }
            ]
          }
          JSON
          cat > reviews/review-status.json <<'JSON'
          {
            "Pinata Smoke Test": {
              "rights_confirmed": true,
              "owner_approved": true
            }
          }
          JSON
      - name: Require configured Pinata secret without exposing it
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then
            echo "::error::PINATA_JWT GitHub Actions secret is missing."
            exit 1
          fi
          echo "PINATA_JWT is present (value hidden)."
      - name: Upload the synthetic test asset to public IPFS
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: npm run pin:approved -- "Pinata Smoke Test"
