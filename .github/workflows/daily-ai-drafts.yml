name: Daily AI Artwork Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: daily-ai-artwork-drafts
  cancel-in-progress: false

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check generation configuration
        id: config
        shell: bash
        run: |
          if [ ! -f workflows/ai-generation.json ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AI generation config is absent; safely skipping."
            exit 0
          fi
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("workflows/ai-generation.json","utf8")); if(c.enabled===true && c.publish_mode==="draft_only") process.exit(0); process.exit(1)' && echo "enabled=true" >> "$GITHUB_OUTPUT" || { echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "Generation is disabled or not draft-only; safely skipping."; }
      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run automated tests
        if: steps.config.outputs.enabled == 'true'
        run: npm test
      - name: Generate AI artwork drafts
        if: steps.config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
        run: npm run generate
      - name: Store private-runner draft artifacts
        if: always() && steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nex orium-ai-drafts-${{ github.run_number }}
          path: |
            assets/ai-generated/
            reviews/ai-generation-queue.json
          if-no-files-found: warn
          retention-days: 14
